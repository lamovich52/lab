<!DOCTYPE html>
<html lang="uk">
<head>

    <title>Лабораторна №4 — Варіант 18</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <article class="product-card">
        <img class="product-image" src="img/processor.jpg"

        <p class="product-property">Тип роз’єму: AM4</p>
